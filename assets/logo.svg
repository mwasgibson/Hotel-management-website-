<svg xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 520 90"
                width="220"
                height="38"
                role="img"
                aria-labelledby="logoTitle">

            <title id="logoTitle">HOTEL NAME</title>

            <!-- Gold divider -->
            <line x1="25" y1="18" x2="495" y2="18"
                stroke="#D4B46A"
                stroke-width="1.5"
                stroke-linecap="round"/>

            <!-- Wordmark -->
            <text x="260"
                y="53"
                text-anchor="middle"
                font-family="'Cormorant Garamond', Georgia, serif"
                font-size="34"
                font-weight="600"
                letter-spacing="6"
                fill="#24324A">
            HOTEL NAME
            </text>

            <!-- Boutique tagline -->
            <text x="260"
                y="73"
                text-anchor="middle"
                font-family="'Cormorant Garamond', Georgia, serif"
                font-size="10"
                font-weight="500"
                letter-spacing="5"
                fill="#D4B46A">
            RESTAURANT  · HOTEL
            </text>
            </svg>