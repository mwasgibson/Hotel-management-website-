<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="css/nav.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">
            <img src="/assets/logo.svg" alt="HOTEL NAME">
        </a>

        <ul class="navbar">
            <li><a href="index.html"><i class="ph ph-house"></i> Home</a></li>
            <li class="dropdown">
                <a href="#"><i class="ph ph-sign-in"></i> Sign Up <i class="ph ph-caret-down"></i></a>

            <span></span><span></span><span></span>

    <hr>

    <h1>Login</h1>

    <form>

        <div class="input-icon-wrap">
            <i class="ph ph-envelope"></i>
            <input type="email" id="email" placeholder="Email" required>
        </div>

        <div class="input-icon-wrap">
            <i class="ph ph-lock"></i>
            <input type="password" id="password" placeholder="Password" required>
        </div>

        <button  type="button" onclick="loginUser()">Login</button>
    </form>

    <script src="js/config.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/staffNav.js"></script>
    <script src="js/help-desk.js"></script>

    <script src="js/nav.js"></script>
