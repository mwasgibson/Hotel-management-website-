<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="css/nav.css">
</head>
<body style="--hero: url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1920&q=80')">
    <nav>
        <h2>Hotel Management</h2>
        <ul>
            <li><a href="index.html"><i class="ph ph-house"></i> Home</a></li>
            <li><a href="rooms.html"><i class="ph ph-bed"></i> Rooms</a></li>
            <li><a href="booking.html"><i class="ph ph-calendar-blank"></i> Booking</a></li>
            <li><a href="login.html"><i class="ph ph-sign-in"></i> Login</a></li>
            <li><a href="contact.html"><i class="ph ph-envelope"></i> Contact</a></li>
        </ul><br>
        <button onclick="Logout()"><i class="ph ph-sign-out"></i> Logout</button>
        <button class="nav-toggle" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <h1>Staff Dashboard</h1>

    <div class="container">

        <section id="stats"></section>

        <h2>Rooms</h2>
        <div id="roomGrid"></div>

        <h2>All Bookings</h2>
        <div class="filters">
            <select id="bookingStatusFilter">
                <option value="">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
            </select>
            <input type="text" id="guestFilter" placeholder="Guest name or email">
            <input type="date" id="bookingCheckInFilter">
            <input type="date" id="bookingCheckOutFilter">
            <button type="button" onclick="searchBookings()">Search</button>
            <button type="button" onclick="clearBookingFilters()">Clear</button>
        </div>
        <div id="allBookings"></div>

        <h2 id="usersHeading" style="display:none;">Guests</h2>
        <div id="allUsers"></div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/staff-dashboard.js"></script>
    <script src="js/reveal.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
