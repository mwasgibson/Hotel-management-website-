<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="css/nav.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html"><i class="ph ph-house"></i> Home</a></li>
            <li><a href="rooms.html"><i class="ph ph-bed"></i> Rooms</a></li>
            <li><a href="register.html"><i class="ph ph-sign-in"></i> Register</a></li>
            <li><a href="login.html"><i class="ph ph-sign-in"></i> Login</a></li>
            <li><a href="booking.html"><i class="ph ph-calendar-blank"></i> Booking</a></li>
            <li><a href="deals.html">Deals</a></li>
            <li><a href="contact.html"><i class="ph ph-envelope"></i> Contact</a></li>
        </ul>
        <button onclick="Logout()"><i class="ph ph-sign-out"></i> Logout</button>
        <button class="nav-toggle" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <h1>Staff Dashboard</h1>

    <div class="container">

        <div class="card">
            <a id="walkInLink" href="walk-in-booking.html" style="display:none;">+ New Walk-in Reservation</a>

            <h2>Pending Payments</h2>
            <div id="pendingManualPayments"></div>
        </div>

        <div class="card">
            <h2>Event Requests</h2>
            <div id="eventRequestsList"></div>
        </div>

        <div class="card">
            <h2 id="eventSpacesHeading" style="display:none;">Manage Event Spaces</h2>
            <div id="manageEventSpaces" style="display:none;"></div>
        </div>

        <div class="card">
            <h2>Stats</h2>
            <section id="stats"></section>
        </div>

        <div class="card">
            <h2>Rooms</h2>
            <div id="roomGrid"></div>
        </div>

        <div class="card">
            <h2 id="servicesHeading" style="display:none;">Manage Services</h2>
            <div id="manageServices" style="display:none;"></div>
        </div>

        <div class="card">
            <h2 id="dealsHeading" style="display:none;">Manage Deals</h2>
            <div id="manageDeals" style="display:none;"></div>
        </div>

        <div class="card">
            <h2>All Bookings</h2>
            <div class="filters">
                <select id="bookingStatusFilter">
                    <option value="">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
                <input type="text" id="guestFilter" placeholder="Guest name or email">
                <input type="date" id="bookingCheckInFilter">
                <input type="date" id="bookingCheckOutFilter">
                <button type="button" onclick="searchBookings()">Search</button>
                <button type="button" onclick="clearBookingFilters()">Clear</button>
            </div>
        </div>

        <div class="card">
            <h2>Bookings</h2>
            <div id="allBookings"></div>
        </div>

        <div class="card">
            <h2>Users</h2>
            <div id="allUsers"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/staffNav.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/staff-dashboard.js"></script>
    <script src="js/reveal.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
