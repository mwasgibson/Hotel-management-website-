<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reserve a Room</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav></nav>
    <h1>Reserve a Room</h1>
    <p>Reserving holds the room for you — payment is required to confirm it.</p>

    <form>
        <input type="number" id="room_number" placeholder="Room ID"><br><br>
        <input type="date" id="check_in"><br><br>
        <input type="date" id="check_out"><br><br>
        <button type="button" onclick="reserveRoom()">Reserve & Pay</button>
    </form>

    <script src="js/config.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/reserve.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
