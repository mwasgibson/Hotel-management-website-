<body style="--hero: url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1920&q=80')">

    <h1>Reserve a Room</h1>
    <p>Reserving holds the room for you — payment is required to confirm it.</p>

    <form>
        <div id="selectedRoomDisplay" style="display:none;"></div>
        <input type="hidden" id="room_number_hidden">

        <select id="room_number">
        <option value="">Loading rooms...</option>
        </select><br><br>

        <div class="service-card">
            <div id="servicesPicker"></div>
        </div>
        
        <input type="date" id="check_in" name="Check In"><br><br>
        <input type="date" id="check_out" name="Check Out"><br><br>

        <button type="button" onclick="reserveRoom()">Reserve & Pay</button>
    </form>

    <script src="js/config.js"></script>
