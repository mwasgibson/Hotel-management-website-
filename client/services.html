<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="css/nav.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">
            <img src="/assets/logo.svg" alt="HOTEL NAME">
        </a>

        <ul class="navbar">
            <li><a href="index.html"><i class="ph ph-house"></i> Home</a></li>
            <li><a href="#" onclick="goToDashboard(); return false;"><i class="ph ph-squares-four"></i> Dashboard</a></li>
            <li class="dropdown">
                <a href="#"><i class="ph ph-calendar-blank"></i> Bookings <i class="ph ph-caret-down"></i></a>
                <ul class="dropdown-menu">
                    <li><a href="booking.html">Booking</a></li>
                    <li><a href="reserve.html">Reservations</a></li>
                </ul>
            </li>
            <li><a href="rooms.html"><i class="ph ph-bed"></i> Rooms</a></li>
            <li class="dropdown">
                <a href="#"><i class="ph ph-handshake"></i> Promotions <i class="ph ph-caret-down"></i></a>
                <ul class="dropdown-menu">
                    <li><a href="deals.html">Deals</a></li>
                    <li><a href="events.html">Events</a></li>
                </ul>
            </li>
            <li><a href="contact.html"><i class="ph ph-envelope"></i> Contact</a></li>
        </ul>
        <button onclick="Logout()"><i class="ph ph-sign-out"></i> Logout</button>
        <button class="nav-toggle" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </nav>
    <div class="nav-overlay"></div>

    <div class="container">
        <h1>My Services</h1>
        <div id="bookingInfo"></div>
        <div id="currentServices"></div>
        
        <div class="service-card" data-id="${service.id}" data-price="${service.price}">
            <div id="servicesPicker"></div>
        </div>
        <button onclick="addServices()"> Add To My Bill </button>
    </div>

    <script src="js/config.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/staffNav.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/services-picker.js"></script>
    <script src="js/services.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
