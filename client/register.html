<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="css/nav.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html"><i class="ph ph-house"></i> Home</a></li>
            <li><a href="#" onclick="goToDashboard(); return false;"><i class="ph ph-squares-four"></i> Dashboard</a></li>
            <li><a href="login.html"><i class="ph ph-sign-in"></i> Login</a></li>
            <li><a href="contact.html"><i class="ph ph-envelope"></i> Contact</a></li>
        </ul>
        <button class="nav-toggle" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </nav>
    <div class="nav-overlay"></div>

    <hr>

    <h1>Create Account</h1>

    <form>
        <div class="input-icon-wrap">
            <i class="ph ph-user"></i>
            <input type="text" id="fullname" placeholder="Full Name">
        </div>

        <div class="input-icon-wrap">
            <i class="ph ph-envelope"></i>
            <input type="email" id="email" placeholder="Email">
        </div>

        <select id="role" required>
            <option value="guest">Guest</option>
            <option value="admin">Admin</option>
            <option value="receptionist">Receptionist</option>
        </select>

        <div class="input-icon-wrap">
            <i class="ph ph-lock"></i>
            <input type="password" id="password" placeholder="Password">
        </div>

        <button  type="button" onclick="registerUser()">Register</button>
    </form>

    <script src="js/config.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/staffNav.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/reveal.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
