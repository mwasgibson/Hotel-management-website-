<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="css/nav.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Your Hotel</a>

        <ul class="navbar">
            <li><a href="index.html"><i class="ph ph-house"></i> Home</a></li>
            <li class="dropdown">
                <a href="#"><i class="ph ph-calendar-blank"></i> Bookings <i class="ph ph-caret-down"></i></a>
                <ul class="dropdown-menu">
                    <li><a href="booking.html">Booking</a></li>
                    <li><a href="reserve.html">Reservations</a></li>
                </ul>
            </li>
            <li><a href="rooms.html"><i class="ph ph-bed"></i> Rooms</a></li>
            <li class="dropdown">
                <a href="#"><i class="ph ph-handshake"></i> Promotions <i class="ph ph-caret-down"></i></a>
                <ul class="dropdown-menu">
                    <li><a href="deals.html">Deals</a></li>
                    <li><a href="events.html">Events</a></li>
                </ul>
            </li>
            <li><a href="contact.html"><i class="ph ph-envelope"></i> Contact</a></li>
        </ul>
        <button onclick="Logout()"><i class="ph ph-sign-out"></i> Logout</button>
        <button class="nav-toggle" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </nav>
    <div class="nav-overlay"></div>

    <h1>Dashboard</h1>

    <div class="container">

        <div class="card">
            <h2>Profile</h2>
            <div id="profile"></div>
        </div>

        <div class="card">
            <a id="serviceLink" href="services.html">+ Add New Service</a>

            <h2>Add Services</h2>
            <div id="bookingInfo"></div>
            <div id="currentServices"></div>
        </div>

        <div class="card">
            <a id="eventLink" href="events.html">+ New Event Request</a>

            <h2>My Event Requests</h2>
            <div id="myEventBookings"></div>
        </div>

        <div class="card">    
            <h2>Payment history</h2>
            <div id="payments"></div>
        </div>

        <div class="card">
            <h2>Bookings</h2>
            <div id="booking-list"></div>
        </div>
        
        <div class="card">
            <h2>Booking Summary</h2>
            <p id="totalBookings"></p>
            <p id="confirmedBookings"></p>
            <p id="pendingBookings"></p>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/staffNav.js"></script>
    <script src="js/help-desk.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/reveal.js"></script>
    <script src="js/nav.js"></script>
    
</body>
</html>
