<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Walk-in Reservation</title>
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html"><i class="ph ph-house"></i> Home</a></li>
            <li><a href="rooms.html"><i class="ph ph-bed"></i> Rooms</a></li>
            <li><a href="#" onclick="goToDashboard(); return false;"><i class="ph ph-squares-four"></i> Dashboard</a></li>
            <li><a href="booking.html"><i class="ph ph-calendar-blank"></i> Booking</a></li>
            <li><a href="deals.html"><i class="ph ph-handshake"></i>Deals</a></li>
            <li><a href="contact.html"><i class="ph ph-envelope"></i> Contact</a></li>
        </ul>
        <button onclick="Logout()"><i class="ph ph-sign-out"></i> Logout</button>
        <button class="nav-toggle" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </nav>
    <div class="nav-overlay"></div>

    <h1>New Walk-in Reservation</h1>

    <form>
        <input type="text" id="fullname" placeholder="Guest full name" required>
        <input type="text" id="phone" placeholder="Phone number" required>
        <input type="email" id="email" placeholder="Email (optional)">

        <select id="room_number">
            <option value="">Loading rooms...</option>
        </select>

        <label>Check-in</label>
        <input type="date" id="check_in">
        <label>Check-out</label>
        <input type="date" id="check_out">

        <select id="payment_method">
            <option value="cash">Cash</option>
            <option value="card">Card</option>
            <option value="mpesa">Mpesa</option>
        </select>

        <div id="mpesaFields" style="display:none;">
            <label>M-Pesa Phone Number</label>
            <input type="text" id="phone" placeholder="07XXXXXXXX">
        </div>

        <div class="service-card" data-id="${service.id}" data-price="${service.price}">
            <div id="servicesPicker"></div>
        </div>

        <input type="text" id="promo_code" placeholder="Promo code (optional)">
        <button type="button" onclick="applyPromoPreview()">Apply</button>
        <p id="promoPreviewResult"></p>

        <label><input type="checkbox" id="payment_received"> Payment received now</label>

        <button type="button" onclick="createWalkInBooking()">Create Reservation</button>
    </form>

    <div id="result"></div>
    <div id="receipt" style="display:none;"></div>

    <script src="js/config.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/staffNav.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/services-picker.js"></script>
    <script src="js/walk-in-booking.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
