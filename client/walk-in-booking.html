<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Walk-in Reservation</title>
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">
            <img src="/assets/logo.svg" alt="HOTEL NAME">
        </a>

        <ul class="navbar">
            <li><a href="index.html"><i class="ph ph-house"></i> Home</a></li>
            <li><a href="contact.html"><i class="ph ph-envelope"></i> Contact</a></li>
        </ul>
        <button onclick="Logout()"><i class="ph ph-sign-out"></i> Logout</button>
        <button class="nav-toggle" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </nav>
    <div class="nav-overlay"></div>

    <h1>New Walk-in Reservation</h1>

    <form>
        <input type="text" id="fullname" placeholder="Guest full name" required>
        <input type="text" id="phone" placeholder="Phone number" required>
        <input type="email" id="email" placeholder="Email (optional)">

        <select id="room_number">
            <option value="">Loading rooms...</option>
        </select>

        <label>Check-in</label>
        <input type="date" id="check_in">
        <label>Check-out</label>
        <input type="date" id="check_out">

        <select id="payment_method" onchange="toggleWalkInPaymentFields()">
            <option value="cash">Cash</option>
            <option value="card">Card</option>
            <option value="mpesa">M-Pesa</option>
        </select>

        <div id="mpesaPhoneField" style="display:none;">
            <input type="text" id="mpesa_phone" placeholder="Phone number for M-Pesa prompt (e.g. 0712345678)">
        </div>

        <label id="paymentReceivedLabel"><button id="payment_received">Confirmed</button></label><br>

        <div class="service-card" data-id="${service.id}" data-price="${service.price}">
            <div id="servicesPicker"></div>
        </div>

        <input type="text" id="promo_code" placeholder="Promo code (optional)">
        <button type="button" onclick="applyPromoPreview()">Apply</button>
        <p id="promoPreviewResult"></p>

        <button type="button" onclick="createWalkInBooking()">Create Reservation</button>
    </form>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-brand">
                <a href="index.html">
                    <img src="../assets/logo-light.svg" alt="HOTEL NAME">
                </a>
            </div>
            <div class="footer-links">
                <div class="footer-column">
                    <h4>Explore</h4>
                    <a href="index.html">Home</a>
                    <a href="#" onclick="goToDashboard(); return false;">Dashboard</a>
                    <a href="register.html">Register</a>
                    <a href="login.html">Login</a>
                </div>
                <div class="footer-column">
                    <h4>Rooms</h4>
                    <a href="rooms.html">Rooms</a>
                </div>
                <div class="footer-column">
                    <h4>Bookings</h4>
                    <a href="booking.html">Booking</a>
                    <a href="reserve.html">Reservations</a>
                </div>
                <div class="footer-column">
                    <h4>Promotions</h4>
                    <a href="deals.html">Deals</a>
                    <a href="events.html">Events</a>
                </div>
            </div>
            <div class="footer-column">
                <h4>Contact Us</h4>
                <a href="contact.html">Contact</a>
                <a href="tel:+254108962037">
                    <i class="ph ph-phone"></i>
                    +254 108 962 037
                </a>
                <a href="mailto:gibsonmwangi72@gmail.com">
                    <i class="ph ph-envelope"></i>
                    gibsonmwangi72@gmail.com
                </a>
                <span style="color: var(--gold)">
                    <i class="ph ph-map-pin"></i>
                    Nairobi, Kenya
                </span>
            </div>
        </div>
    <hr>
        <div class="footer-bottom">
            <p>© 2026 HOTEL NAME</p>
            <div class="footer-bottom-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms & Conditions</a>
                <a href="#">Cookies</a>
            </div>
        </div>
    </footer>

    <div id="result"></div>
    <div id="receipt" style="display:none;"></div>

    <script src="js/config.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/staffNav.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/services-picker.js"></script>
    <script src="js/walk-in-booking.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
